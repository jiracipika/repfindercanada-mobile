workflows:
  release-both:
    name: "One-click: Build iOS (TestFlight) + Android (Play)"
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_connect       # same group you use for iOS
        - google_play             # must exist and contain GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.marcelsabas.repfinderforcanada"
        JAVA_HOME: /Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home
        PACKAGE_NAME: "com.marcelsabas.canadarepfinder"
      node: 20
      xcode: latest
      cocoapods: default
      android_signing:
        - akey                    # uses your uploaded keystore
    scripts:
      - name: Set up code signing
        script: |
          # Custom code signing (docs: "Custom code signing" section). The
          # managed ios_signing block was removed — it only consumes profiles
          # from the team store, which expired 2026-10-01 and were removed.
          # fetch-signing-files --create mints a fresh app_store profile for
          # the bundle id via the App Store Connect API and binds it to the
          # Codemagic-generated distribution cert (RepFinder Distribution 2026).
          # NOTE: = form is required for --private-key — the PEM value starts
          # with dashes, which argparse would read as another option.
          set -e
          # The 2026 distribution cert already exists in ASC (created via the
          # Codemagic UI), but its private key only exists in the team's
          # downloaded .p12 — without it the tool cannot save the certificate
          # ("Cannot save Signing Certificates without certificate private key").
          # DIST_CERT_PRIVATE_KEY (app_store_connect group) = base64 of that PEM.
          # openssl pkcs12 prints "Bag Attributes" headers before the key —
          # keep only the PEM block, and never echo it (set -e + no set -x).
          export DIST_CERT_KEY="$(echo "$DIST_CERT_PRIVATE_KEY" | base64 --decode | awk '/BEGIN/{f=1} f{print}')"
          app-store-connect fetch-signing-files \
            com.marcelsabas.repfinderforcanada \
            --type IOS_APP_STORE \
            --issuer-id="$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id="$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key="$APP_STORE_CONNECT_PRIVATE_KEY" \
            --certificate-key="$DIST_CERT_KEY" \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Install npm deps
        script: |
          npm install
      - name: Install Android SDK 36
        script: |
          # sdkmanager is not on PATH on the current mac_mini_m2 image —
          # resolve it the same way the android-play-store workflow does.
          SDKMGR=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36"
      - name: Build web + sync Capacitor (iOS & Android)
        script: |
          npm run build
          npx cap sync ios
          npx cap sync android
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Increment iOS build number
        script: |
          cd ios/App
          agvtool new-marketing-version 3.3.2
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build iOS .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release
      - name: Build Android .aab
        script: |
          cd android
          # Signed release: injected signing properties (same as the
          # android-play-store workflow) — an unsigned bundle is rejected by
          # Play ("All uploaded bundles must be signed"). Probe for a JDK that
          # can read the keystore (newer keytool formats break zulu-17).
          GRADLE_JAVA_HOME=""
          for V in 21 26 17; do
            J="/Library/Java/JavaVirtualMachines/zulu-$V.jdk/Contents/Home"
            if [ -x "$J/bin/keytool" ]; then
              if "$J/bin/keytool" -list -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
                echo "== zulu-$V can read the keystore; building with zulu-$V =="
                GRADLE_JAVA_HOME="$J"
                break
              else
                echo "== zulu-$V CANNOT read the keystore =="
              fi
            fi
          done
          if [ -z "$GRADLE_JAVA_HOME" ]; then
            echo "NO JDK on the image can read the keystore"
            keytool -list -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" || true
            exit 1
          fi
          ./gradlew -Dorg.gradle.java.home="$GRADLE_JAVA_HOME" bundleRelease -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
      - name: Publish AAB to closed + open testing tracks
        script: |
          # The publishing.google_play block below only covers internal.
          # alpha = Closed testing (Alpha), beta = Open testing. Re-uploading
          # the same versionCode to more tracks is allowed (idempotent).
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          for T in alpha beta; do
            echo "== Publishing AAB to $T =="
            google-play bundles publish \
              --credentials @env:GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS \
              --bundle "$AAB" --track "$T"
          done
    artifacts:
      - build/ios/ipa/*.ipa
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

  ios-app-store:
    name: React Native Capacitor Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_connect
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.marcelsabas.repfinderforcanada"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          # Custom code signing — same flow as release-both: create the
          # app_store profile on the fly via the ASC API (uploaded profiles
          # expired 2026-10-01 and were removed from the team store).
          # = form required for --private-key (PEM value starts with dashes).
          set -e
          # The 2026 distribution cert already exists in ASC (created via the
          # Codemagic UI), but its private key only exists in the team's
          # downloaded .p12 — without it the tool cannot save the certificate
          # ("Cannot save Signing Certificates without certificate private key").
          # DIST_CERT_PRIVATE_KEY (app_store_connect group) = base64 of that PEM.
          # openssl pkcs12 prints "Bag Attributes" headers before the key —
          # keep only the PEM block, and never echo it (set -e + no set -x).
          export DIST_CERT_KEY="$(echo "$DIST_CERT_PRIVATE_KEY" | base64 --decode | awk '/BEGIN/{f=1} f{print}')"
          app-store-connect fetch-signing-files \
            com.marcelsabas.repfinderforcanada \
            --type IOS_APP_STORE \
            --issuer-id="$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id="$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key="$APP_STORE_CONNECT_PRIVATE_KEY" \
            --certificate-key="$DIST_CERT_KEY" \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build web app and sync with Capacitor
        script: |
          npm run build
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-marketing-version 3.3.2
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false

  android-play-store:
    name: Android Play Store Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - google_play
      vars:
        JAVA_HOME: /Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home
        PACKAGE_NAME: "com.marcelsabas.canadarepfinder"
      node: 20
      android_signing:
        - akey
    scripts:
      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > $CM_KEYSTORE_PATH
      - name: Install npm dependencies
        script: |
          npm install
      - name: Install Android SDK 36
        script: |
          SDKMGR=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36"
      - name: Build web app and sync with Capacitor
        script: |
          npm run build
          npx cap sync android
      - name: Build Android App Bundle
        script: |
          cd android
          # Find a JDK that can actually read the keystore (newer keytool formats
          # are unreadable by zulu-17 -> "Tag number over 30 is not supported").
          GRADLE_JAVA_HOME=""
          for V in 21 26 17; do
            J="/Library/Java/JavaVirtualMachines/zulu-$V.jdk/Contents/Home"
            if [ -x "$J/bin/keytool" ]; then
              if "$J/bin/keytool" -list -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
                echo "== zulu-$V can read the keystore; building with zulu-$V =="
                GRADLE_JAVA_HOME="$J"
                break
              else
                echo "== zulu-$V CANNOT read the keystore =="
              fi
            fi
          done
          if [ -z "$GRADLE_JAVA_HOME" ]; then
            echo "NO JDK on the image can read the keystore"
            keytool -list -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" || true
            exit 1
          fi
          ./gradlew -Dorg.gradle.java.home="$GRADLE_JAVA_HOME" assembleRelease -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
          ./gradlew -Dorg.gradle.java.home="$GRADLE_JAVA_HOME" bundleRelease -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - rajingajadhar@gmail.com
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
